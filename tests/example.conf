# Synthetic configuration written for OpenWall tests.
config system interface
 edit "wan"
  set vdom "root"
  set type physical
  set ip 192.0.2.2 255.255.255.0
 next
 edit "lan"
  set vdom "root"
  set type physical
  set ip 198.51.100.1 255.255.255.0
 next
end
config firewall address
 edit "LAN network"
  set subnet 198.51.100.0 255.255.255.0
 next
end
config firewall policy
 edit 10
  set name "Block SSH"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "LAN network"
  set dstaddr "all"
  set action deny
  set schedule "always"
  set service "SSH"
  set logtraffic all
 next
 edit 20
  set name "Internet"
  set srcintf "lan"
  set dstintf "wan"
  set srcaddr "LAN network"
  set dstaddr "all"
  set action accept
  set schedule "always"
  set service "ALL"
  set nat enable
 next
end
config router static
 edit 1
  set gateway 192.0.2.1
  set device "wan"
 next
end