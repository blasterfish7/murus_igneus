name: Publish verified alpha.4 prerelease
on:
  push:
    branches: [codex/release-alpha4]
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-alpha4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original artifacts and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/alpha4/publish.py
