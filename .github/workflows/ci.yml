name: Diagnose Devuan bootstrap trust package
on:
  push:
    branches: [codex/devuan-bootstrap-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: dyne/devuan:excalibur@sha256:10f6138df94c08164f300a2f35f96cd8c8966fc4948550dbe0485149d020248f
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Verify seed trust anchors and bootstrap a signed fresh root
        shell: bash
        run: |
          set -euxo pipefail
          cp packaging/devuan/sources.list /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          apt-get update
          apt-get install -y --no-install-recommends mmdebstrap dpkg-repack
          dpkg -V devuan-keyring
          mkdir /tmp/diag-keyring
          cd /tmp/diag-keyring
          dpkg-repack devuan-keyring
          sha256sum *.deb
          mmdebstrap --mode=root --format=directory --variant=minbase --architectures=amd64 --keyring=/usr/share/keyrings/devuan-archive-keyring.gpg --include=apt --aptopt='Acquire::AllowInsecureRepositories "false"' --aptopt='APT::Get::AllowUnauthenticated "false"' excalibur /tmp/diag-devuan-root "$GITHUB_WORKSPACE/packaging/devuan/sources.list"
          cp devuan-keyring_*.deb /tmp/diag-devuan-root/tmp/trust.deb
          chroot /tmp/diag-devuan-root dpkg -i /tmp/trust.deb
          cp "$GITHUB_WORKSPACE/packaging/devuan/sources.list" /tmp/diag-devuan-root/etc/apt/sources.list
          chroot /tmp/diag-devuan-root apt-get update
          chroot /tmp/diag-devuan-root apt-cache policy devuan-keyring base-files apt
          cat /tmp/diag-devuan-root/etc/os-release
          chroot /tmp/diag-devuan-root dpkg-query -W devuan-keyring base-files apt
