name: Publish verified alpha.10
on:
  push:
    branches: [codex/release-alpha10]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original ISO, sources and all asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          MURUS_RELEASE_TARGET: bfa526f0140595c7dad6afa48d4326164b35c772
          MURUS_DRAFT_ID: '426467921'
          MURUS_TESTED_SOURCE: a5249d17f0a50e3aa45195b50d7ba6be8c7e856a
          MURUS_TESTED_RUN: '40662424590'
        run: python3 tools/publish-alpha10.py
