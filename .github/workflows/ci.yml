name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install protocol test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends snmp snmpd
      - name: Python syntax
        run: python -m compileall -q src/murus_igneus
      - name: Install configuration parser used by Devuan
        run: python -m pip install PyYAML==6.0.2
      - name: Static Python checks
        run: |
          python -m pip install ruff==0.11.13
          python -m ruff check --select F,E9 src tests
      - name: Migration regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell and JavaScript syntax
        run: |
          sh -n packaging/devuan/build-deb.sh
          sh -n packaging/devuan/files/murus-igneus.initd
          sh -n packaging/devuan/files/murus-serve
          node --check src/murus_igneus/app.js
          node --check src/murus_igneus/management.js
          node tests/test_management_ui.js
      - name: Build Devuan package
        run: sh packaging/devuan/build-deb.sh
      - name: Upload Devuan package
        uses: actions/upload-artifact@v4
        with:
          name: murus-igneus-devuan-alpha
          path: dist/*.deb
          retention-days: 14

  devuan-iso:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: dyne/devuan:excalibur@sha256:10f6138df94c08164f300a2f35f96cd8c8966fc4948550dbe0485149d020248f
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build signed-main Devuan appliance ISO
        run: bash tools/build-devuan-iso.sh
      - name: Save ISO, checksums and package manifest
        uses: actions/upload-artifact@v4
        with:
          name: murus-igneus-devuan-iso
          path: |
            dist/*.iso
            dist/SHA256SUMS
            dist/packages-devuan.tsv
            dist/signature-status.txt
            dist/clamav-build.log
          compression-level: 0
          retention-days: 14



