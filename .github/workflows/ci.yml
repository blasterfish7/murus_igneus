name: Cleanup obsolete build artifacts
on:
  push:
    branches: [codex/cleanup-artifacts-20261026]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete old merged-build copies and stale main caches; verify releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          from urllib.error import HTTPError
          API="https://api.github.com/repos/blasterfish7/murus_igneus"
          def api(path, method="GET"):
              req=urllib.request.Request(API+path,method=method,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read()
                  return json.loads(data) if data else None
          def pages(path,key):
              rows=[]
              for page in range(1,21):
                  data=api(path+("?per_page=100&page=" if "?" not in path else "&per_page=100&page=")+str(page))[key]
                  rows.extend(data)
                  if len(data)<100:return rows
              raise RuntimeError("Inventory exceeded bounded pagination")
          def snapshot():
              return sorted((r["id"],r["tag_name"],sorted((a["id"],a["name"],a["size"],a.get("digest")) for a in r["assets"])) for r in api("/releases?per_page=100"))
          before=snapshot()
          assert any(r[1]=="v0.3.0-alpha.7" and any(a[0]==675411908 and a[2]==475041792 and a[3]=="sha256:44c2af50e1a5df6dd4335a36fcee5a58133bfc5c0091bfb2cf556c0bb594115e" for a in r[2]) for r in before)
          main=api("/git/ref/heads/main")["object"]["sha"]
          assert main=="ce4af00760ce4ef320a89f937259cb0ff33f2a65"
          artifacts=pages("/actions/artifacts","artifacts")
          caches=pages("/actions/caches","actions_caches")
          known={};runs={}
          def ancestor(sha):
              if sha not in known:
                  try:known[sha]=api("/compare/"+sha+"..."+main)["behind_by"]==0
                  except HTTPError as e:
                      if e.code not in (404,409):raise
                      known[sha]=False
              return known[sha]
          selected=[]
          for a in artifacts:
              if a["expired"] or not a["name"].startswith("murus-") or a["created_at"]>="2026-10-25T15:43:28Z":continue
              run=a.get("workflow_run") or {}
              if not run.get("head_sha") or not ancestor(run["head_sha"]):continue
              ident=run["id"]
              if ident not in runs:runs[ident]=api("/actions/runs/"+str(ident))["status"]
              if runs[ident]=="completed":selected.append(a)
          cache_selected=[c for c in caches if c["ref"]=="refs/heads/main" and c["last_accessed_at"]<"2026-10-19T00:00:00Z"]
          assert len(selected)<=1000 and len(cache_selected)<=100
          print("Inventory:",json.dumps({"artifacts":len(artifacts),"caches":len(caches),"eligible_artifacts":len(selected),"eligible_caches":len(cache_selected),"preserved_unmerged_sources":[s for s,v in known.items() if not v]}),flush=True)
          deleted=[];deleted_caches=[]
          for a in selected:
              api("/actions/artifacts/"+str(a["id"]),"DELETE")
              deleted.append({"id":a["id"],"bytes":a["size_in_bytes"]})
          for c in cache_selected:
              api("/actions/caches/"+str(c["id"]),"DELETE")
              deleted_caches.append({"id":c["id"],"bytes":c["size_in_bytes"]})
          assert snapshot()==before,"Release assets changed"
          assert api("/git/ref/heads/main")["object"]["sha"]==main,"Main moved during cleanup"
          report={"deleted_artifacts":len(deleted),"deleted_caches":len(deleted_caches),"artifact_bytes":sum(x["bytes"] for x in deleted),"cache_bytes":sum(x["bytes"] for x in deleted_caches),"releases_unchanged":True,"main_unchanged":True,"remaining_artifacts":api("/actions/artifacts?per_page=1")["total_count"]}
          print("CLEANUP_REPORT="+json.dumps(report),flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:f.write("# Temporary build cleanup\n\n"+json.dumps(report,indent=2)+"\n")
          
