name: Cleanup obsolete ISO artifacts
on:
  push:
    branches: [codex/cleanup-artifacts-20261024]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Remove obsolete temporary ISO copies and verify releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, os, urllib.request
          repo = "blasterfish7/murus_igneus"
          api = "https://api.github.com/repos/" + repo
          def request(path, method="GET"):
              req = urllib.request.Request(api + path, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
                  return json.loads(data) if data else None
          def releases():
              return sorted((r["id"], r["tag_name"], sorted((a["id"], a["name"], a["size"], a.get("digest")) for a in r["assets"]))
                            for r in request("/releases?per_page=100"))
          before = releases()
          assert any(r[1] == "v0.3.0-alpha.5" and any(a[0] == 663437520 and a[2] == 475017216 for a in r[2]) for r in before)
          assert any(r[1] == "v0.3.0-alpha.4" for r in before)
          artifacts = []
          for page in range(1, 21):
              batch = request("/actions/artifacts?per_page=100&page=" + str(page))["artifacts"]
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("Artifact inventory exceeds bounded pagination")
          selected = [a for a in artifacts if a["name"] == "murus-igneus-devuan-iso"
                      and a["created_at"] < "2026-10-22T00:00:00Z" and not a["expired"]]
          assert all(a["size_in_bytes"] > 100000000 for a in selected)
          assert len(selected) <= 50
          print("Selected obsolete ISO build copies:", json.dumps([{"id": a["id"], "bytes": a["size_in_bytes"], "created": a["created_at"]} for a in selected]), flush=True)
          deleted = []
          for a in selected:
              request("/actions/artifacts/" + str(a["id"]), "DELETE")
              deleted.append({"id": a["id"], "bytes": a["size_in_bytes"]})
              print("Deleted temporary artifact", a["id"], a["size_in_bytes"], flush=True)
          assert releases() == before, "Published release assets changed"
          remaining = request("/actions/artifacts?per_page=100")
          report = {"deleted": deleted, "freed_bytes": sum(a["bytes"] for a in deleted),
                    "release_assets_unchanged": True, "remaining_artifacts": remaining["total_count"]}
          print("CLEANUP_REPORT=" + json.dumps(report), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("# GitHub Actions cleanup\n\nDeleted %d obsolete ISO build copies; freed %d bytes.\n\nAll published releases and their assets verified unchanged.\n" % (len(deleted), report["freed_bytes"]))
          
