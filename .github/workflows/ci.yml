name: Publish verified alpha.8
on:
  push:
    branches: [codex/release-alpha8]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original ISO, package sources and all asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          MURUS_RELEASE_TARGET: 4d4c70081973b0f0a1b4c00bb27ee7548a3b3ab3
          MURUS_DRAFT_ID: 425445360
        run: python3 tools/publish-alpha8.py
