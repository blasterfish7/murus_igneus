name: Publish verified alpha.2 prerelease
on:
  push:
    branches: [codex/release-alpha2]
permissions:
  contents: write
concurrency:
  group: publish-alpha2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify draft assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/alpha2/publish.py
