name: Diagnose Devuan bootstrap metadata
on:
  push:
    branches: [codex/devuan-bootstrap-diagnostics]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: dyne/devuan:excalibur@sha256:10f6138df94c08164f300a2f35f96cd8c8966fc4948550dbe0485149d020248f
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Inspect signed archive and seed package metadata
        shell: bash
        run: |
          set -euxo pipefail
          cp packaging/devuan/sources.list /etc/apt/sources.list
          rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          apt-get update
          apt-cache policy devuan-keyring base-files apt debootstrap
          dpkg-query -W devuan-keyring base-files apt
          dpkg -L devuan-keyring
          cat /etc/os-release
          apt-config dump | sed -n '/IndexTargets/,/};/p'
          apt-get install -y --no-install-recommends mmdebstrap
          mmdebstrap --mode=root --format=directory --variant=minbase --architectures=amd64 --keyring=/usr/share/keyrings/devuan-archive-keyring.gpg --include=apt,devuan-keyring --aptopt='Acquire::AllowInsecureRepositories "false"' --aptopt='APT::Get::AllowUnauthenticated "false"' excalibur /tmp/diag-devuan-root packaging/devuan/sources.list || true
          if [ -e /tmp/diag-devuan-root/etc/os-release ]; then cat /tmp/diag-devuan-root/etc/os-release; fi
          if [ -x /tmp/diag-devuan-root/usr/bin/apt-cache ]; then
            chroot /tmp/diag-devuan-root apt-cache policy devuan-keyring base-files apt
            ls -lh /tmp/diag-devuan-root/var/lib/apt/lists/
          fi
