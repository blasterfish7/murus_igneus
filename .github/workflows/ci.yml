name: Publish validated alpha.6
on:
  push:
    branches: [codex/release-alpha6]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original build, source and all asset digests before publication
        env:
          GH_TOKEN: ${{ github.token }}
          MURUS_RELEASE_TARGET: bef489b88c7e837e04e597042a9b770f0c45e7bc
          MURUS_DRAFT_ID: 423011067
        run: python3 tools/publish-alpha6.py
