name: Publish verified alpha.7
on:
  push:
    branches: [codex/release-alpha7]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original ISO, package sources and release digests
        env:
          GH_TOKEN: ${{ github.token }}
          MURUS_RELEASE_TARGET: 0d4aee5f8af4d4b0000c2101b09ae2a9df859d2a
          MURUS_DRAFT_ID: 423492814
        run: python3 tools/publish-alpha7.py
