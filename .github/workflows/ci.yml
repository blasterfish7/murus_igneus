name: Publish verified alpha.9
on:
  push:
    branches: [codex/release-alpha9]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original ISO, package sources and all asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          MURUS_RELEASE_TARGET: 7df5cfc45e3d13f446b26ed326d8850c8432c9da
          MURUS_DRAFT_ID: '426404136'
          MURUS_TESTED_SOURCE: '5dc406daae89e20adb7a207597730b9ad88c8e46'
          MURUS_TESTED_RUN: '40653511277'
        run: python3 tools/publish-alpha9.py
