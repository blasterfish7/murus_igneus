name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        run: python -m compileall -q src/murus_igneus
      - name: Migration regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v