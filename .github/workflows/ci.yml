name: Publish verified alpha.5
on:
  push:
    branches: [codex/release-alpha5]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original build, attach assets and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/alpha5/publish.py
