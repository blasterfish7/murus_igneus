name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python syntax
        run: python -m compileall -q src/murus_igneus
      - name: Static checks (undefined names, unused imports, syntax errors)
        run: |
          python -m pip install --quiet ruff==0.16.8
          ruff check --select F,E9 src tests
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
